<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddbd6e"/>
      <stop offset="100%" stop-color="#e67d71"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.9">
    <!-- Building/construction shape -->
    <rect x="180" y="120" width="240" height="180" rx="2"/>
    <!-- Roof -->
    <path d="M160 120 L440 120 L420 80 L180 80 Z"/>
    <!-- Windows grid -->
    <line x1="220" y1="80" x2="220" y2="300"/>
    <line x1="260" y1="80" x2="260" y2="300"/>
    <line x1="300" y1="80" x2="300" y2="300"/>
    <line x1="340" y1="80" x2="340" y2="300"/>
    <line x1="380" y1="80" x2="380" y2="300"/>
    <!-- Horizontal lines -->
    <line x1="180" y1="160" x2="420" y2="160"/>
    <line x1="180" y1="200" x2="420" y2="200"/>
    <line x1="180" y1="240" x2="420" y2="240"/>
    <!-- Base -->
    <line x1="160" y1="300" x2="440" y2="300"/>
  </g>
  <g fill="#d85a4b" opacity="0.5">
    <circle cx="300" cy="120" r="5"/>
  </g>
</svg>
