<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67d71"/>
      <stop offset="100%" stop-color="#ddbd6e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d85a4b"/>
      <stop offset="100%" stop-color="#e67d71"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0aaa1"/>
      <stop offset="100%" stop-color="#e67d71"/>
    </linearGradient>
    <linearGradient id="tattoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d85a4b"/>
      <stop offset="100%" stop-color="#c14a3b"/>
    </linearGradient>
  </defs>

  <!-- Soft halo background -->
  <circle cx="300" cy="340" r="240" fill="none" stroke="url(#grad)" stroke-width="0.5" opacity="0.2"/>

  <!-- Hair - short pixie cut, textured -->
  <g fill="none" stroke="url(#hair)" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <!-- Main hair mass -->
    <path d="M200 220 Q180 260 175 300 Q172 340 180 380"/>
    <path d="M210 210 Q195 250 192 290 Q190 330 198 370"/>
    <path d="M220 205 Q210 245 208 285 Q207 325 215 360"/>
    <!-- Top volume -->
    <path d="M230 200 Q250 170 280 160 Q310 155 340 165 Q370 175 390 200"/>
    <path d="M250 185 Q270 160 300 150 Q330 160 360 180"/>
    <!-- Textured strands -->
    <path d="M235 195 Q240 220 238 245" stroke-width="1.2"/>
    <path d="M250 188 Q255 215 253 240" stroke-width="1.2"/>
    <path d="M270 180 Q275 210 273 235" stroke-width="1"/>
    <path d="M290 175 Q295 205 293 230" stroke-width="1"/>
    <path d="M310 175 Q315 205 313 230" stroke-width="1"/>
    <path d="M330 180 Q335 210 333 235" stroke-width="1.2"/>
    <path d="M350 188 Q355 215 353 240" stroke-width="1.2"/>
    <path d="M365 195 Q370 220 368 245" stroke-width="1.2"/>
    <!-- Side texture -->
    <path d="M395 210 Q405 250 408 290 Q410 330 405 370" stroke-width="1.4"/>
    <path d="M400 220 Q408 260 410 300 Q412 340 408 380" stroke-width="1.2"/>
  </g>

  <!-- Neck -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 520 Q275 560 280 600"/>
    <path d="M330 520 Q325 560 320 600"/>
    <path d="M275 590 Q300 600 325 590"/>
  </g>

  <!-- Shoulders and collarbones -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Collarbones -->
    <path d="M220 610 Q260 600 280 605 Q300 610 320 605 Q340 600 380 610"/>
    <path d="M240 615 Q280 608 300 612 Q320 608 360 615"/>
    <!-- Shoulders -->
    <path d="M150 650 Q200 620 260 615 Q300 612 340 615 Q380 620 450 650"/>
    <path d="M160 660 Q210 630 270 625 Q300 622 330 625 Q390 630 440 660"/>
  </g>

  <!-- Face - detailed contours -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Forehead -->
    <path d="M240 300 Q230 340 235 370"/>
    <!-- Brow ridge -->
    <path d="M235 330 Q260 315 285 325"/>
    <!-- Cheekbone -->
    <path d="M235 370 Q220 400 230 430"/>
    <!-- Jaw line -->
    <path d="M230 430 Q245 470 275 500"/>
    <!-- Chin -->
    <path d="M275 500 Q300 510 325 500"/>
    <!-- Jaw line right -->
    <path d="M325 500 Q355 470 370 430"/>
    <!-- Cheekbone right -->
    <path d="M370 430 Q380 400 365 370"/>
    <!-- Brow ridge right -->
    <path d="M365 370 Q380 340 360 310"/>
    <!-- Forehead right -->
    <path d="M360 310 Q365 280 350 250"/>
  </g>

  <!-- Nose - detailed -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bridge -->
    <path d="M300 325 Q295 350 290 375"/>
    <!-- Nose tip -->
    <path d="M290 375 Q280 390 285 400 Q295 405 310 400 Q315 395 310 385"/>
    <!-- Wing left -->
    <path d="M285 400 Q275 405 270 400"/>
    <!-- Wing right -->
    <path d="M310 400 Q320 405 325 400"/>
    <!-- Minimal hatching under nose -->
    <path d="M285 402 Q295 408 305 402" stroke-width="0.8" opacity="0.5"/>
    <path d="M288 405 Q295 410 302 405" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Eyes - looking right and up, cat-eye eyeliner -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.5" stroke-linecap="round">
    <!-- Left eye - cat-eye shape, looking up-right -->
    <path d="M238 360 Q260 348 282 358"/>
    <!-- Upper lid with cat-eye flick -->
    <path d="M238 360 Q260 350 282 358 Q290 355 295 348"/>
    <!-- Lower lid -->
    <path d="M242 363 Q260 356 278 363"/>
    <!-- Iris -->
    <circle cx="260" cy="362" r="6" fill="none" stroke-width="1.2"/>
    <!-- Pupil -->
    <circle cx="260" cy="362" r="2.5" fill="url(#skin)" opacity="0.6"/>
    <!-- Eyelashes upper -->
    <path d="M238 360 Q232 354 228 348" stroke-width="1.8"/>
    <path d="M245 358 Q241 351 240 344" stroke-width="1.5"/>
    <path d="M255 356 Q253 349 254 342" stroke-width="1.3"/>
    <path d="M268 357 Q268 350 271 343" stroke-width="1.3"/>
    <path d="M278 359 Q280 353 284 347" stroke-width="1.5"/>
    <!-- Cat-eye flick upper -->
    <path d="M290 355 Q295 348 298 342" stroke-width="1.8"/>
    <!-- Eyelashes lower -->
    <path d="M242 363 Q238 368 236 374" stroke-width="1"/>
    <path d="M250 365 Q248 370 248 376" stroke-width="1"/>
    <path d="M270 365 Q272 370 272 376" stroke-width="1"/>
    <path d="M278 363 Q282 368 284 374" stroke-width="1"/>

    <!-- Right eye - cat-eye shape, looking up-right -->
    <path d="M318 358 Q340 348 362 360"/>
    <!-- Upper lid with cat-eye flick -->
    <path d="M318 358 Q340 350 362 360 Q370 357 375 350"/>
    <!-- Lower lid -->
    <path d="M322 363 Q340 356 358 363"/>
    <!-- Iris -->
    <circle cx="340" cy="362" r="6" fill="none" stroke-width="1.2"/>
    <!-- Pupil -->
    <circle cx="340" cy="362" r="2.5" fill="url(#skin)" opacity="0.6"/>
    <!-- Eyelashes upper -->
    <path d="M318 360 Q312 354 308 348" stroke-width="1.8"/>
    <path d="M325 358 Q321 351 320 344" stroke-width="1.5"/>
    <path d="M335 356 Q333 349 334 342" stroke-width="1.3"/>
    <path d="M348 357 Q348 350 351 343" stroke-width="1.3"/>
    <path d="M358 359 Q360 353 364 347" stroke-width="1.5"/>
    <!-- Cat-eye flick upper -->
    <path d="M370 357 Q375 350 378 344" stroke-width="1.8"/>
    <!-- Eyelashes lower -->
    <path d="M322 363 Q318 368 316 374" stroke-width="1"/>
    <path d="M330 365 Q328 370 328 376" stroke-width="1"/>
    <path d="M350 365 Q352 370 352 376" stroke-width="1"/>
    <path d="M358 363 Q362 368 364 374" stroke-width="1"/>
  </g>

  <!-- Eyebrows - defined arch -->
  <g fill="none" stroke="url(#hair)" stroke-width="1.6" stroke-linecap="round">
    <!-- Left eyebrow -->
    <path d="M230 338 Q250 320 275 328"/>
    <path d="M233 342 Q252 326 272 332"/>
    <!-- Right eyebrow -->
    <path d="M325 328 Q350 320 370 338"/>
    <path d="M328 332 Q348 326 367 342"/>
  </g>

  <!-- Lips - slightly open, detailed -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper lip -->
    <path d="M268 445 Q282 438 300 442 Q318 438 332 445"/>
    <!-- Lip peak left -->
    <path d="M268 445 Q275 440 282 442"/>
    <!-- Lip peak right -->
    <path d="M318 442 Q325 440 332 445"/>
    <!-- Lower lip -->
    <path d="M272 447 Q300 460 328 447"/>
    <!-- Lip line -->
    <path d="M272 447 Q300 443 328 447"/>
    <!-- Minimal hatching for depth -->
    <path d="M275 449 Q285 455 295 449" stroke-width="0.8" opacity="0.4"/>
    <path d="M305 449 Q315 455 325 449" stroke-width="0.8" opacity="0.4"/>
    <!-- Open mouth hint -->
    <path d="M280 448 Q300 454 320 448" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Right hand supporting head -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Forearm -->
    <path d="M420 480 Q400 450 380 430 Q360 410 340 400"/>
    <!-- Wrist -->
    <path d="M340 400 Q330 395 320 390"/>
    <!-- Palm -->
    <path d="M320 390 Q310 385 300 380 Q290 378 280 380"/>
    <!-- Fingers touching face -->
    <path d="M280 380 Q270 375 260 370 Q250 365 240 358"/>
    <path d="M285 382 Q275 378 265 373 Q255 368 245 362"/>
    <path d="M290 384 Q280 380 270 376 Q260 372 250 367"/>
    <path d="M295 386 Q285 382 275 378 Q265 374 255 369"/>
    <!-- Knuckles and joints -->
    <path d="M320 390 Q325 385 330 380" stroke-width="1"/>
    <path d="M310 385 Q315 380 320 375" stroke-width="1"/>
    <path d="M300 381 Q305 376 310 371" stroke-width="1"/>
    <!-- Thumb -->
    <path d="M340 400 Q350 395 355 388 Q360 380 355 372"/>
  </g>

  <!-- Left hand with anchor tattoo, butterfly earring, nails -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrist -->
    <path d="M180 400 Q190 395 200 390"/>
    <!-- Palm -->
    <path d="M200 390 Q210 385 220 380 Q230 378 240 380"/>
    <!-- Fingers touching cheek -->
    <path d="M240 380 Q250 375 260 370 Q270 365 280 360"/>
    <path d="M245 382 Q255 377 265 372 Q275 367 285 362"/>
    <path d="M250 384 Q260 379 270 374 Q280 369 290 364"/>
    <path d="M255 386 Q265 381 275 376 Q285 371 295 366"/>
    <!-- Knuckles -->
    <path d="M200 390 Q195 385 190 380" stroke-width="1"/>
    <path d="M210 385 Q205 380 200 375" stroke-width="1"/>
    <path d="M220 381 Q215 376 210 371" stroke-width="1"/>

    <!-- Anchor tattoo on wrist -->
    <g stroke="url(#tattoo)" stroke-width="1.2" opacity="0.7">
      <!-- Anchor shaft -->
      <line x1="180" y1="400" x2="180" y2="430"/>
      <!-- Anchor ring -->
      <circle cx="180" cy="395" r="5"/>
      <!-- Anchor crossbar -->
      <line x1="165" y1="415" x2="195" y2="415"/>
      <!-- Anchor flukes -->
      <path d="M165 415 Q170 425 180 430 Q190 425 195 415"/>
      <path d="M170 425 Q175 432 180 435 Q185 432 190 425"/>
    </g>

    <!-- Butterfly earring (on left ear) -->
    <g stroke="url(#grad)" stroke-width="1.2" fill="none">
      <path d="M195 340 Q185 335 180 340 Q185 345 195 340"/>
      <path d="M195 340 Q205 335 210 340 Q205 345 195 340"/>
      <line x1="195" y1="340" x2="195" y2="350"/>
      <circle cx="195" cy="340" r="1.5" fill="url(#grad)" opacity="0.6"/>
    </g>
  </g>

  <!-- Almond nails detail on raised hand -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.2" stroke-linecap="round">
    <!-- Nail 1 -->
    <path d="M240 380 Q238 375 240 370 Q242 375 240 380"/>
    <!-- Nail 2 -->
    <path d="M250 382 Q248 377 250 372 Q252 377 250 382"/>
    <!-- Nail 3 -->
    <path d="M260 375 Q258 370 260 365 Q262 370 260 375"/>
    <!-- Nail 4 -->
    <path d="M270 370 Q268 365 270 360 Q272 365 270 370"/>
  </g>

  <!-- Minimal hatching for deep shadows -->
  <g stroke="url(#skin)" stroke-width="0.7" opacity="0.35">
    <!-- Under cheekbones -->
    <path d="M230 430 Q235 435 240 430"/>
    <path d="M360 430 Q365 435 370 430"/>
    <!-- Corner of mouth -->
    <path d="M268 446 Q265 450 268 453"/>
    <path d="M332 446 Q335 450 332 453"/>
    <!-- Hair texture -->
    <path d="M220 210 Q225 215 220 220"/>
    <path d="M380 210 Q385 215 380 220"/>
    <path d="M240 200 Q245 205 240 210"/>
    <path d="M360 200 Q365 205 360 210"/>
  </g>

  <!-- Accent points -->
  <g fill="#d85a4b" opacity="0.5">
    <circle cx="260" cy="362" r="2.5"/>
    <circle cx="340" cy="362" r="2.5"/>
    <circle cx="300" cy="442" r="2"/>
    <circle cx="300" cy="510" r="2.5"/>
    <circle cx="180" cy="435" r="2"/>
  </g>
</svg>
