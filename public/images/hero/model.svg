<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67d71"/>
      <stop offset="100%" stop-color="#ddbd6e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d85a4b"/>
      <stop offset="100%" stop-color="#e67d71"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0aaa1"/>
      <stop offset="100%" stop-color="#e67d71"/>
    </linearGradient>
  </defs>

  <!-- Soft halo background -->
  <circle cx="300" cy="340" r="240" fill="none" stroke="url(#grad)" stroke-width="0.5" opacity="0.2"/>

  <!-- Hair flowing behind - soft strands -->
  <g fill="none" stroke="url(#hair)" stroke-width="1.8" stroke-linecap="round" opacity="0.7">
    <path d="M220 260 Q200 340 205 420 Q210 500 230 560"/>
    <path d="M230 250 Q215 330 220 410 Q225 490 240 550"/>
    <path d="M240 245 Q230 320 235 400 Q240 480 250 540"/>
    <path d="M380 260 Q400 340 395 420 Q390 500 370 560"/>
    <path d="M370 250 Q385 330 380 410 Q375 490 360 550"/>
    <path d="M360 245 Q370 320 365 400 Q360 480 350 540"/>
  </g>

  <!-- Neck and shoulders - graceful -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 520 Q275 560 280 600"/>
    <path d="M330 520 Q325 560 320 600"/>
    <path d="M220 610 Q270 590 280 600 Q300 610 320 600 Q330 590 380 610"/>
    <path d="M180 620 Q220 590 270 620"/>
    <path d="M420 620 Q380 590 330 620"/>
  </g>

  <!-- Face - elegant profile, closed eyes -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Forehead -->
    <path d="M300 210 Q340 230 360 260 Q370 285 365 310"/>
    <!-- Brow -->
    <path d="M360 310 Q355 322 350 332"/>
    <!-- Nose bridge -->
    <path d="M350 332 Q340 358 330 380 Q320 398 310 405"/>
    <!-- Nose tip -->
    <path d="M310 405 Q300 410 290 405 Q285 400 288 393"/>
    <!-- Philtrum -->
    <path d="M288 393 Q292 415 300 430"/>
    <!-- Upper lip -->
    <path d="M300 430 Q312 426 325 430 Q330 434 327 438"/>
    <!-- Lower lip -->
    <path d="M327 438 Q318 446 300 448 Q282 446 273 438"/>
    <!-- Lip line -->
    <path d="M273 438 Q300 433 327 438"/>
    <!-- Chin -->
    <path d="M273 438 Q265 455 270 475 Q280 495 300 500"/>
    <!-- Jaw line -->
    <path d="M300 500 Q330 495 350 475 Q365 455 370 430"/>
    <!-- Cheekbone -->
    <path d="M365 310 Q380 340 370 370 Q360 390 350 410"/>
  </g>

  <!-- Closed eyes - peaceful, elegant -->
  <g fill="none" stroke="url(#skin)" stroke-width="1.5" stroke-linecap="round">
    <!-- Left eye - closed, soft line -->
    <path d="M338 355 Q350 348 362 355"/>
    <path d="M342 357 Q350 351 358 357"/>
    <!-- Soft lashes -->
    <path d="M338 355 Q334 350 332 344" stroke-width="1.2"/>
    <path d="M345 353 Q343 347 343 341" stroke-width="1.2"/>
    <path d="M355 353 Q356 347 356 341" stroke-width="1.2"/>
    <path d="M362 355 Q366 350 368 344" stroke-width="1.2"/>

    <!-- Right eye - closed, soft line -->
    <path d="M238 355 Q250 348 262 355"/>
    <path d="M242 357 Q250 351 258 357"/>
    <!-- Soft lashes -->
    <path d="M238 355 Q234 350 232 344" stroke-width="1.2"/>
    <path d="M245 353 Q243 347 243 341" stroke-width="1.2"/>
    <path d="M255 353 Q256 347 256 341" stroke-width="1.2"/>
    <path d="M262 355 Q266 350 268 344" stroke-width="1.2"/>
  </g>

  <!-- Eyebrows - soft, natural arch -->
  <g fill="none" stroke="url(#hair)" stroke-width="1.4" stroke-linecap="round">
    <path d="M232 335 Q250 322 270 330"/>
    <path d="M330 330 Q350 322 368 335"/>
  </g>

  <!-- Hair front - soft flowing strands -->
  <g fill="none" stroke="url(#hair)" stroke-width="1.8" stroke-linecap="round">
    <!-- Hairline -->
    <path d="M250 250 Q270 210 300 200 Q330 210 350 250 Q370 280 380 320"/>
    <!-- Volume -->
    <path d="M270 220 Q290 190 320 200 Q340 210 330 240"/>
    <path d="M290 205 Q310 185 330 200 Q345 215 335 245"/>
    <!-- Flowing right -->
    <path d="M380 320 Q390 360 395 400 Q398 440 390 480" stroke-width="1.6"/>
    <path d="M375 330 Q385 370 388 410 Q390 450 385 490" stroke-width="1.4"/>
    <!-- Flowing left -->
    <path d="M250 250 Q240 290 238 330 Q236 370 240 410" stroke-width="1.6"/>
    <path d="M255 260 Q248 300 247 340 Q246 380 250 420" stroke-width="1.4"/>
    <!-- Soft wisps -->
    <path d="M300 200 Q295 240 298 280 Q302 320 310 360" stroke-width="1.3" opacity="0.8"/>
    <path d="M320 205 Q325 245 322 285 Q318 325 310 365" stroke-width="1.3" opacity="0.7"/>
  </g>

  <!-- Decorative sketch accents -->
  <g fill="none" stroke="url(#skin)" stroke-width="0.8" opacity="0.3">
    <path d="M150 340 Q140 380 150 420"/>
    <path d="M450 340 Q460 380 450 420"/>
    <path d="M170 500 Q190 520 210 510"/>
    <path d="M430 500 Q410 520 390 510"/>
  </g>

  <!-- Accent points -->
  <g fill="#d85a4b" opacity="0.45">
    <circle cx="300" cy="195" r="3"/>
    <circle cx="350" cy="355" r="2"/>
    <circle cx="250" cy="355" r="2"/>
    <circle cx="300" cy="448" r="2"/>
    <circle cx="300" cy="500" r="2.5"/>
  </g>
</svg>
