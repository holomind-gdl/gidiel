<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67d71"/>
      <stop offset="100%" stop-color="#ddbd6e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d85a4b"/>
      <stop offset="100%" stop-color="#e67d71"/>
    </linearGradient>
  </defs>

  <!-- Soft halo -->
  <circle cx="300" cy="340" r="240" fill="none" stroke="url(#grad)" stroke-width="0.6" opacity="0.2"/>

  <!-- Hair back flow -->
  <g fill="none" stroke="url(#hair)" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M220 260 Q200 340 205 420 Q210 500 230 560"/>
    <path d="M230 250 Q215 330 220 410 Q225 490 240 550"/>
    <path d="M240 245 Q230 320 235 400 Q240 480 250 540"/>
  </g>

  <!-- Neck -->
  <g fill="none" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round">
    <path d="M270 520 Q275 560 280 600"/>
    <path d="M330 520 Q325 560 320 600"/>
    <path d="M280 580 Q300 590 320 580"/>
  </g>

  <!-- Shoulders -->
  <g fill="none" stroke="url(#grad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 620 Q220 590 275 600"/>
    <path d="M420 620 Q380 590 325 600"/>
    <path d="M220 610 Q300 640 380 610"/>
  </g>

  <!-- Face profile - elegant side view -->
  <g fill="none" stroke="url(#grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Forehead -->
    <path d="M300 200 Q340 220 360 260 Q370 290 365 320"/>
    <!-- Brow ridge -->
    <path d="M360 320 Q355 335 350 345"/>
    <!-- Nose bridge -->
    <path d="M350 345 Q340 370 330 390 Q320 405 310 410"/>
    <!-- Nose tip -->
    <path d="M310 410 Q300 415 290 410 Q285 405 288 398"/>
    <!-- Philtrum -->
    <path d="M288 398 Q292 420 300 435"/>
    <!-- Upper lip -->
    <path d="M300 435 Q310 432 320 435 Q325 438 322 442"/>
    <!-- Lower lip -->
    <path d="M322 442 Q315 450 300 452 Q285 450 278 442"/>
    <!-- Lip line -->
    <path d="M278 442 Q300 438 322 442"/>
    <!-- Chin -->
    <path d="M278 442 Q270 460 275 480 Q280 500 300 510"/>
    <!-- Jaw line -->
    <path d="M300 510 Q330 500 350 480 Q365 460 370 430"/>
    <!-- Cheekbone -->
    <path d="M365 320 Q380 350 370 380 Q360 400 350 420"/>
  </g>

  <!-- Eye - looking forward with lashes -->
  <g fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round">
    <!-- Eye shape -->
    <path d="M340 350 Q355 342 370 350"/>
    <path d="M345 352 Q355 346 365 352"/>
    <!-- Iris -->
    <circle cx="355" cy="352" r="4" fill="url(#grad)" opacity="0.5"/>
    <!-- Upper lashes -->
    <path d="M340 350 Q335 343 332 336"/>
    <path d="M345 349 Q342 341 341 334"/>
    <path d="M352 348 Q350 340 350 333"/>
    <!-- Lower lashes -->
    <path d="M370 350 Q375 356 378 362"/>
    <path d="M365 352 Q369 358 372 364"/>
  </g>

  <!-- Eyebrow - elegant arch -->
  <g fill="none" stroke="url(#hair)" stroke-width="1.5" stroke-linecap="round">
    <path d="M335 332 Q355 318 378 328"/>
    <path d="M338 336 Q355 325 375 333"/>
  </g>

  <!-- Hair front - flowing, elegant strands -->
  <g fill="none" stroke="url(#hair)" stroke-width="2" stroke-linecap="round">
    <!-- Main hairline -->
    <path d="M260 240 Q280 200 320 190 Q360 200 380 240 Q400 280 410 330"/>
    <!-- Volume top -->
    <path d="M280 210 Q310 180 340 200 Q360 220 350 250"/>
    <path d="M300 195 Q330 175 360 195 Q380 215 370 250"/>
    <!-- Flowing strands right -->
    <path d="M410 330 Q420 370 425 410 Q428 450 420 490"/>
    <path d="M405 340 Q415 380 418 420 Q420 460 415 500"/>
    <path d="M400 350 Q408 390 410 430 Q412 470 408 510"/>
    <!-- Flowing strands left -->
    <path d="M260 240 Q250 280 248 320 Q246 360 250 400"/>
    <path d="M265 250 Q258 290 257 330 Q256 370 260 410"/>
    <!-- Soft wisps over face -->
    <path d="M320 190 Q315 230 318 270 Q322 310 330 350" stroke-width="1.4" opacity="0.85"/>
    <path d="M340 195 Q345 235 342 275 Q338 315 330 355" stroke-width="1.4" opacity="0.75"/>
    <path d="M360 210 Q368 250 365 290 Q360 330 350 370" stroke-width="1.4" opacity="0.7"/>
  </g>

  <!-- Decorative sketch accents -->
  <g fill="none" stroke="url(#grad)" stroke-width="0.8" opacity="0.3">
    <path d="M140 320 Q130 360 140 400"/>
    <path d="M460 320 Q470 360 460 400"/>
    <path d="M160 480 Q180 500 200 490"/>
    <path d="M440 480 Q420 500 400 490"/>
  </g>

  <!-- Accent dots -->
  <g fill="#d85a4b" opacity="0.45">
    <circle cx="320" cy="185" r="3"/>
    <circle cx="355" cy="352" r="2.5"/>
    <circle cx="300" cy="445" r="2"/>
    <circle cx="300" cy="510" r="2.5"/>
  </g>
</svg>
